name: Python CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[server,test]"
      - name: Verify package and test suite
        run: |
          python -m compileall -q agents icd11_coder cli.py enrichment.py simulator.py
          python -m pytest -q
      - name: Confirm safe Compose configuration
        run: |
          python -c 'from pathlib import Path; c=Path("docker-compose.yml").read_text(); assert "AUDIT_SECRET_KEY" in c and "127.0.0.1:8000:8000" in c'
