name: Python CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[server,test]"
      - name: Verify package and test suite
        run: |
          python -m compileall -q agents icd11_coder cli.py enrichment.py simulator.py
          python -m pytest -q
      - name: Check for tracked embedded audit secret
        run: |
          if grep -R -n 'who-icd11-multilingual-auto-coder-prod-audit-key-2026' --include='*.yml' --include='*.yaml' .; then exit 1; fi
