[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "who-icd11-multilingual-auto-coder"
version = "2.0.0"
description = "ICD11-Coder: WHO ICD-11 Linearization & Post-Coordination Cluster Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
who-icd11-multilingual-auto-coder = "icd11_coder.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/who-icd11-multilingual-auto-coder"
Repository = "https://github.com/abusuraihsakhri/who-icd11-multilingual-auto-coder.git"
