[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "who-icd11-multilingual-auto-coder"
version = "2.0.1"
description = "Experimental threshold audit toolkit; not a validated ICD-11 code assignment system"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*", "icd11_coder*"]

[project.scripts]
who-icd11-multilingual-auto-coder = "icd11_coder.cli:main"
who-icd11-audit = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/who-icd11-multilingual-auto-coder"
Repository = "https://github.com/abusuraihsakhri/who-icd11-multilingual-auto-coder"
