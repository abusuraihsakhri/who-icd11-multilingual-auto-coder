version: '3.8'

services:
  who-icd11-multilingual-auto-coder:
    build: .
    container_name: who-icd11-multilingual-auto-coder
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=who-icd11-multilingual-auto-coder-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
